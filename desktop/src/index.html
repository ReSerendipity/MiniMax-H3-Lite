<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MM·H3 工作台启动中</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(180deg, #17211f 0%, #121a18 55%, #0e1513 100%);
      color: rgba(232,240,238,0.92);
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    .logo-mark { width: 72px; height: 72px; margin-bottom: 16px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 18px;
      background: linear-gradient(145deg, #15726c 0%, #0d534e 100%);
      box-shadow: 0 8px 28px rgba(21,114,108,0.35), inset 0 1px 0 rgba(255,255,255,0.12);
    }
    .logo-text {
      font-size: 30px; font-weight: 600; letter-spacing: 1px;
      color: rgba(240,247,245,0.95);
    }
    .subtitle {
      font-size: 13px; color: rgba(232,240,238,0.45);
      letter-spacing: 0.5px; margin: 10px 0 34px;
    }
    .spinner {
      width: 38px; height: 38px;
      border: 3px solid rgba(21,114,108,0.22);
      border-top-color: #2ba39a;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 22px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 13px; color: rgba(232,240,238,0.66); min-height: 20px; text-align: center; max-width: 520px; }
    .error {
      color: #e8a496; margin-top: 14px;
      font-size: 12.5px; max-width: 480px; white-space: pre-line;
      text-align: center; line-height: 1.7;
    }
    .actions { display: flex; gap: 12px; margin-top: 18px; }
    .btn {
      padding: 8px 26px; color: #f0f7f5;
      background: #15726c; border: none; border-radius: 7px;
      cursor: pointer; font-size: 13px; font-family: inherit;
      transition: background .15s ease;
    }
    .btn:hover { background: #1e8f87; }
    .btn-secondary {
      background: transparent; color: rgba(232,240,238,0.78);
      border: 1px solid rgba(232,240,238,0.28);
    }
    .btn-secondary:hover { background: rgba(232,240,238,0.08); }
    .model-hint {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: none; align-items: center; justify-content: center; gap: 14px;
      padding: 12px 20px;
      background: rgba(230,138,46,0.10);
      border-top: 1px solid rgba(230,138,46,0.35);
      color: #f0c696; font-size: 12.5px;
    }
    .model-hint .link { color: #f0a95c; cursor: pointer; text-decoration: underline; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="logo-mark">
    <!-- 品牌图形取自 assets/favicon.svg（放映机），按深色底重配色 -->
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#a8e6df" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/>
      <rect x="3.9" y="8.2" width="8.2" height="7.6" rx="1.4"/>
      <circle cx="8" cy="12" r="2.6"/>
      <circle cx="8" cy="12" r="0.8" fill="#e68a2e" stroke="none"/>
      <path d="M12.1 10.2 H13.3 M12.1 13.8 H13.3" stroke-width="1.3"/>
      <rect x="13.3" y="9.3" width="6.8" height="5.2" rx="1"/>
      <rect x="5.1" y="6.6" width="3.4" height="1.6" rx="0.8"/>
    </svg>
  </div>
  <div class="logo-text">MM·H3 工作台</div>
  <div class="subtitle">MiniMax H3 视频生成时间线 · 桌面版</div>

  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">正在启动...</div>
  <div class="error hidden" id="error"></div>
  <div class="actions hidden" id="actions">
    <button class="btn" id="retryBtn">重试</button>
    <button class="btn btn-secondary hidden" id="guideBtn">打开模型下载指引</button>
  </div>

  <div class="model-hint" id="modelHint">
    <span>未检测到模型权重（<span id="modelCats"></span>）。应用可正常启动，生成前需按指引就位模型。</span>
    <span class="link" id="guideLink">查看下载指引</span>
  </div>

  <script>
    (function () {
      var T = window.__TAURI__;
      var statusEl = document.getElementById('status');
      var spinner = document.getElementById('spinner');
      var errorEl = document.getElementById('error');
      var actions = document.getElementById('actions');
      var hint = document.getElementById('modelHint');

      function invoke(cmd, args) {
        try { return T && T.invoke && T.invoke(cmd, args || {}); } catch (e) {}
      }
      function showError(msg) {
        spinner.classList.add('hidden');
        errorEl.textContent = msg || '';
        errorEl.classList.remove('hidden');
        actions.classList.remove('hidden');
      }
      function showModelHint(cats) {
        if (!cats || !cats.length) return;
        document.getElementById('modelCats').textContent = cats.join(' / ');
        hint.style.display = 'flex';
        document.getElementById('guideBtn').classList.remove('hidden');
      }

      document.getElementById('retryBtn').addEventListener('click', function () {
        errorEl.classList.add('hidden');
        spinner.classList.remove('hidden');
        if (statusEl) statusEl.textContent = '正在重试...';
        invoke('retry_start');
      });
      function openGuide() { invoke('open_model_guide'); }
      document.getElementById('guideBtn').addEventListener('click', openGuide);
      document.getElementById('guideLink').addEventListener('click', openGuide);

      if (T && T.event && T.event.listen) {
        T.event.listen('startup-status', function (event) {
          var data = event.payload || {};
          if (statusEl) statusEl.textContent = data.message || '';
          if (data.error) showError(data.error);
        });
        T.event.listen('model-guide', function (event) {
          showModelHint(event.payload);
        });
      }
      // 主动拉取一次模型状态，规避事件先于监听注册的竞态
      var p = invoke('get_model_status');
      if (p && p.then) p.then(showModelHint).catch(function () {});
    })();
  </script>
</body>
</html>
