name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # 【F-6 2026-09-24】删掉原 job 级
    # `if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'`。
    # 它让 dependabot PR 上的 Analyze (python)/(javascript) 呈现 skipped，与"真扫过且干净"
    # 在 checks 页无法区分——与 #68 之前的 DCO 是同一失效模式，原注释"依赖 bump 不改第一方
    # 源码"是取舍不是判据。
    # 未改成"按提交作者邮箱豁免"（#68 的 DCO 写法），理由：DCO 能那样平移是因为它有一条
    # 可按单条提交判定的规则（Signed-off-by 尾注），豁免该规则后 job 仍在跑真检查；CodeQL
    # 唯一的"规则"就是分析代码本身，按邮箱豁免只会把同一个 skipped 用更绕的写法重造一遍，
    # 达不到"让 dependabot PR 上 CodeQL 真跑"。
    # 额度依据：仓库实测 public ⇒ code scanning 不计费；本仓 CodeQL 全量墙钟 1.4 min
    # （run 35989187876，python+javascript 并行）。
    # 钉死镜像标签：ubuntu-latest 自 2026-10-19 起改指 Ubuntu 26。
    # matrix 只含 language 一维（python/javascript），check 名不受本次改动影响。
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
