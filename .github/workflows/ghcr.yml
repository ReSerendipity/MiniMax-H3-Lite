name: Container image (GHCR)

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read application version
        id: version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("package.json", encoding="utf-8"))["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build image (no publish)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=ghcr-pr
          cache-to: type=gha,mode=max,scope=ghcr-pr

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a version tag in vMAJOR.MINOR.PATCH form; got '$TAG'"
            exit 1
          fi
          version="${TAG#v}"
          package_version=$(python3 -c 'import json; print(json.load(open("package.json", encoding="utf-8"))["version"])')
          if [[ "$version" != "$package_version" ]]; then
            echo "::error::Tag version $version does not match package.json version $package_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish versioned image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/reserendipity/minimax-h3-lite:${{ steps.version.outputs.version }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=ghcr-publish
          cache-to: type=gha,mode=max,scope=ghcr-publish
