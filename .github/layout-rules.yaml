# structure-guard baseline (MiniMax-H3-lite)。root_allowlist 冻结已批准的根级布局。
version: 1
require_dirs:
  - docs
  - scripts
  - .github
forbid_root_patterns:
  # 注：暂缓 '*_AUDIT_*.md$' —— MiniMax 根目录现存 SECURITY_AUDIT_*.md，
  #     待其迁入 docs/ 后再恢复该模式（见 docs/agents 治理说明）。
  - '.*_ASSESSMENT_.*\\.md$'
  - '.*_REVIEW_.*\\.md$'
  - 'REMEDIATION_EXECUTION_LOG.*\\.md$'
  - 'REVISION_LOG.*\\.md$'
  - '.*_EXECUTION_SUMMARY.*\\.md$'
  - '.*_报告_.*\\.md$'
  - '.*评估.*\\.md$'
  - '.*审查.*\\.md$'
  - '.*_release_log.*\\.txt$'
artifact_root_patterns:
  - '.*\\.log$'
  - '.*\\.tmp$'
  - '.*\\.bak$'
  - 'coverage\\.xml$'
  - 'tmp_.*'
  - '.*~$'
gitignored_expect:
  - !! "\345\255\246\344\271\240\344\273\223\345\272\223\345\244\215\346\237\245\345\220\216\347\273\255\344\273\273\345\212\241\346\211\247\350\241\214\350\256\241\345\210\222\344\271\246.md"
  - !! .benchmarks
  - !! .canvas-meta.json
  - !! .coverage
  - !! .design.json
  - !! .mypy_cache
  - !! .pytest_cache
  - !! .ruff_cache
  - !! .trae
  - !! .workbuddy
  - !! .workbuddy-ai
  - !! AGENTS.md
  - !! FIX_LOG.md
  - !! LOCAL_RULES.md
  - !! _archive
  - !! backups
  - !! comfy_kernel
  - !! coverage.xml
  - !! data
  - !! htmlcov
  - !! logs
  - !! model
  - !! node_modules
  - !! outputs
  - !! precheck.ps1
  - !! screenshots
  - !! skills-learning
root_allowlist:
  - "docs
  - .dockerignore
  - .gitattributes
  - .githooks
  - .github
  - .gitignore
  - .pre-commit-config.yaml
  - CHANGELOG.md
  - Dockerfile
  - LICENSE
  - NOTICE
  - PRIVACY_POLICY.md
  - README.md
  - SECURITY_REMEDIATION_TRACKER.md
  - THIRD_PARTY_NOTICES.md
  - USER_AGREEMENT.md
  - assets
  - backend
  - docker-compose.pinned.yml.example
  - docker-compose.yml
  - docs
  - eslint.config.mjs
  - gitleaks.toml
  - logs
  - package-lock.json
  - package.json
  - pytest.ini
  - requirements-frozen-20260913.txt
  - requirements-lock.txt
  - requirements.txt
  - scripts
  - start.bat
  - tests
  - workflows
