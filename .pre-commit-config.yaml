# MM·H3 工作台 - Pre-commit Hooks 配置
# 安装：pip install pre-commit && pre-commit install
# 手动运行：pre-commit run --all-files

repos:
  # ── Python 代码检查 ──────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1024']

  # ── Python linting ──────────────────────────────────────
  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        # 与 CI lint（.github/workflows/test.yml）口径一致：E402 是本仓
        # 「backend 目录先入 sys.path 再扁平导入」的既定模式（backend/main.py、
        # routers/* 均如此），钩子与 CI 不一致会造成本地提交被存量模式卡死
        args: ['--ignore=E501,W503,E402', '--max-line-length=120']
        exclude: ^(tests/node_modules|\.venv)/

  # ── Python 格式化 (可选，如需自动格式化) ───────────────────
  # - repo: https://github.com/psf/black
  #   rev: 24.1.0
  #   hooks:
  #     - id: black
  #       language_version: python3.11

  # ── 安全扫描 ──────────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        args: []  # 故意不传 -r backend/：pre-commit 会把暂存文件追加到命令尾部，带 -r 时每次提交都全量重扫 backend/，32 处存量低危(ffprobe subprocess / try-except-pass)会无差别拦截一切提交；全量扫描归 CI 的 sast job
        exclude: ^(tests|\.venv)/

  # ── 依赖检查 ──────────────────────────────────────────────
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.16
    hooks:
      - id: validate-pyproject

  # ── 敏感信息检测 ──────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # .ci/comfy_kernel_baseline.json 是脚本生成的内核摘要工件：里面的 16 位
        # 十六进制串是 sha256 前缀，不是密钥；且每次内核升级全量重算，若逐个登记进
        # secrets 审计基线会永久制造 churn。完整性由守卫自身 + 其单测负责。
        exclude: ^(tests|\.secrets\.baseline|requirements\.txt|\.ci/comfy_kernel_baseline\.json)$

  - repo: local
    hooks:
      - id: structure-guard
        name: Structure Guard (root layout)
        entry: python .github/scripts/check_layout.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
