on:
  push:
    branches:
      - main
permissions:
  contents: write
  pull-requests: write
name: release-please
jobs:
  release-please:
    runs-on: ubuntu-latest
    # 发布门禁恢复阻断（2026-09-05）：不再用 continue-on-error 掩盖发布失败；
    # release PR 重新启用，版本晋升经人工审查后再发版。
    env:
      GIT_AUTHOR_NAME: ReSerendipity
      GIT_AUTHOR_EMAIL: zengyangc@outlook.com
      GIT_COMMITTER_NAME: ReSerendipity
      GIT_COMMITTER_EMAIL: zengyangc@outlook.com
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: false
