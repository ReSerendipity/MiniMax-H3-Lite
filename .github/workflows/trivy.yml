# .github/workflows/trivy.yml
# 容器镜像漏洞扫描（CI 阻断 HIGH/CRITICAL）
#
# 触发：每次 push main / PR / 手动 dispatch
# 流程：本地 build 镜像（不 push） → 导出合并视图 rootfs → trivy rootfs 扫描
#       → SARIF 上传 Security tab
# 失败条件：发现 HIGH/CRITICAL 级别 CVE 且有可用 fix（`--ignore-unfixed: true`）
#
# ⚠ 为何扫 rootfs 而非 image（2026-09-05 Trivy gate 实证）：
#   基础镜像 python:3.12-slim-bookworm 的 site-packages 种子自带旧版
#   setuptools(70.x)/msgpack(1.1.x)（官方镜像 CVE 清单可直接印证）。
#   后续 Dockerfile 层 pip 升级后，合并视图只剩新版（docker run pip list
#   实证 84.0.0/1.2.2），但 Trivy image 模式逐层分析仍会把幽灵层
#   （层 368659c，含 msgpack 1.1.2 + setuptools 70.3.0）中的旧 dist-info
#   计入结果——层内 rm 生成 whiteout 也无法抑制（run 33981673472 实证），
#   门禁将永远红。改用 docker export 扁平化合并视图后扫描：所见即容器
#   实际运行态，旧层残留天然不可见。
#
# 复用 `Dockerfile` + 仓库的 LABEL 元数据（org.opencontainers.image.*）；
# 不依赖任何外部 registry 凭据。

name: Trivy Container Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # SARIF upload to Security tab

jobs:
  build-and-scan:
    name: Build & scan image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read app version from release-please manifest
        id: appver
        # 用 python3：ubuntu-24.04 runner 无 `python` 命令（PEP 668），此前静默
        # 失败导致 VERSION build-arg 为空（2026-09-05 Trivy CI 首跑实证）。
        # 注意引号层次：YAML 单引号外壳 + python 代码内全部双引号，
        # 不得出现反斜杠续行（曾报 SyntaxError: unexpected character after
        # line continuation character，VERSION 再次为空）。
        run: echo "version=$(python3 -c 'import json;print(json.load(open(".release-please-manifest.json"))["."])')" >> "$GITHUB_OUTPUT"

      - name: Build image (local only; not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: minimax-h3-lite:scan-${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VERSION=${{ steps.appver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export merged rootfs (flatten layers)
        # docker export 产出合并视图（无层历史）：基础镜像幽灵层的旧
        # dist-info 已被上层 pip 安装覆盖/whiteout，导出物中不存在——
        # Trivy rootfs 模式所见即运行态。
        run: |
          docker create --name mmh3-rootfs minimax-h3-lite:scan-${{ github.sha }}
          docker export mmh3-rootfs -o rootfs.tar
          docker rm mmh3-rootfs
          mkdir -p merged-rootfs
          tar -xf rootfs.tar -C merged-rootfs
          rm -f rootfs.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'rootfs'
          scan-ref: 'merged-rootfs'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'        # 有 HIGH/CRITICAL 漏洞就 fail
          vuln-type: 'os,library'
          scanners: 'vuln'
          # torch cu130 + 全量 Python 依赖的 CVE 面很大，默认 5 分钟扫描窗
          # 会 context deadline exceeded（2026-09-05 CI 实证）→ 放宽到 20 分钟
          timeout: '20m'

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-image-scan

      - name: Cleanup
        if: always()
        run: |
          docker rmi minimax-h3-lite:scan-${{ github.sha }} || true
          rm -rf merged-rootfs
