# MM·H3 工作台 - 测试与质量门禁 CI
name: Test & Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:

  # ── 依赖锁一致性门禁（防 Dependabot 分组升级破坏 requirements-lock.txt）──
  lock-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 锁文件可解析性断言（dry-run 安装，不下载 wheel）
        # 仅解析依赖元数据；若锁内存在版本冲突（如 pydantic-core 与 pydantic 约束不一致）
        # 会在解析阶段即报 ResolutionImpossible，远快于 python-test 的全量 torch 安装。
        run: |
          python -m pip install --upgrade pip
          pip install --dry-run -r requirements-lock.txt

      - name: 锁覆盖对账（requirements.txt 直接依赖须入锁或显式豁免）
        # 【F-3 2026-09-24】补上一步 dry-run 结构上看不到的另一半：dry-run 只证明
        # 「锁自身可解析」，证明不了「两份清单同源」。2026-09-24 实测有 17 个直接依赖
        # 不在锁里而本 job 照样绿。本步做成双向棘轮（新增缺失、豁免失效都判红），
        # 豁免理由与被否证的「不影响测试覆盖」实测见脚本 docstring。
        # 纯标准库、无需装依赖，故仍留在 python-test 之前秒级返回。
        run: python scripts/check_lock_coverage.py

  # ── 完整性清单新鲜度门禁（防改了 backend 代码却忘了重算重签清单）──────────
  # 漂移的后果不是"红线"而已：INTEGRITY_ENFORCE 默认 True 且 fail-closed，
  # 从这种 main 全新装出去的工作台会在启动自检处直接拒启（2026-09-17~09-19 实况）。
  # 纯标准库脚本，无需装依赖，故排在 python-test 之前秒级返回。
  integrity-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 清单 vs backend/ 实际哈希（漂移即失败并给出重签命令）
        run: python scripts/generate_integrity_manifest.py --check

  # ── Python 后端测试 ──────────────────────────────────────
  python-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install pytest pytest-cov pytest-benchmark

      - name: Run tests with coverage
        env:
          MMH3_INFERENCE_BACKEND: diffusers
        # 覆盖率门禁与 pytest.ini 保持一致（60%）；禁止 || true / continue-on-error 吞错
        run: pytest tests/ --cov=backend --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=60 -v

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ── 前端冒烟测试 + Playwright E2E ──────────────────────
  frontend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        # render_pages.py 需要 jinja2；E2E webServer 需要 fastapi/uvicorn/pydantic。
        # 全部为轻量纯 Python 依赖（torch/diffusers 仅推理执行时函数内延迟导入，
        # 浏览器冒烟不触发）。
        # 【订正 2026-09-24】原注释写作"不能装全量 requirements-lock（含 torch，数 GB）"，
        # 与事实不符：requirements-lock.txt 实测 78 个唯一条目、torch 条目数 = 0。
        # 不装全量锁的真实理由只是墙钟（多装 70 余个包），不是 torch 体积。
        # 这条假注释是"锁里钉着 torch、该加 +cpu 断言"错判的来源，故按实测改直。
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Python deps (template render + uvicorn web server)
        # python-multipart：/api/upload 的 File/Form 路由注册硬依赖（缺失时
        # uvicorn 直接退出，E2E webServer 起不来——CI 首跑 2026-09-05 实证）。
        # R10 完整性自检（backend/main.py startup）需要 cryptography 验签——
        # 缺了它 uvicorn 启动即失败，E2E webServer 起不来（frontend-smoke 依赖集更新）。
        run: pip install jinja2 fastapi "uvicorn[standard]" pydantic python-multipart cryptography

      - name: Install dependencies
        run: |
          npm ci
          cd tests && npm ci

      - name: Install Playwright Chromium
        run: cd tests && npx playwright install --with-deps chromium

      - name: Run frontend smoke test
        run: npm run test:frontend

      - name: Run Playwright E2E
        run: cd tests && npx playwright test --config frontend/playwright.config.js

  # ── 代码质量检查 ──────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Lint Python
        run: |
          pip install flake8
          flake8 backend/ tests/*.py \
            --ignore=E501,W503,E402 \
            --max-line-length=120 \
            --count --show-source --statistics

      - name: Install Node lint tools
        run: npm ci

      - name: Lint JavaScript
        # 业务前端脚本（assets/**/*.js）与测试脚本一并纳入静态检查。
        run: npx eslint tests/frontend/*.js tests/*.js assets/**/*.js --no-error-on-unmatched-pattern

  # ── 类型门禁（mypy ratchet，家族底线；2026-09-03 试点接入组织模板）──
  # 门禁逻辑统一维护在 ReSerendipity/.github 的 python-quality-baseline.yml，
  # 本仓只传个性化参数（include_tests=false：覆盖率门禁仍由本仓 python-test
  # job 把守，模板此处只提供 typecheck）。
  # 基线 .ci/mypy_baseline.txt=7：阻断债务上升而非要求清零；模板口径为
  # typecheck 只装 mypy 不装项目依赖，改 mypy 版本须重算基线。
  # （原内联实现见 git 历史 f13e1fc；mypy ratchet 门禁 2026-09-03 迁移自组织级 reusable workflow（原迁移报告未随本仓留存））
  typecheck:
    name: Typecheck (mypy ratchet)
    uses: ReSerendipity/.github/.github/workflows/python-quality-baseline.yml@main
    with:
      package: backend
      include_tests: false
      mypy_target: backend/
      mypy_baseline_file: .ci/mypy_baseline.txt
    permissions:
      contents: read

  # ── 安全扫描 ──────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        # Node 20 已过 EOL（GH 自身也在弃用其 actions 运行时的 Node 20），统一升到 22 LTS。
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          npm ci

      - name: Python security audit
        # 报告生成与门禁判定分离：pip-audit 自身非零退出不在此处阻断（报告损坏时
        # 由 security_gate.py 判失败），告警判定统一交给棘轮门禁。
        run: |
          set -euo pipefail
          pip install pip-audit
          pip-audit --format json > pip-audit-report.json || true
          cat pip-audit-report.json

      - name: NPM security audit
        # 恢复报告职责：阻断判定统一由 security_gate.py 按 .ci/security_baseline.json
        # 棘轮执行（critical/high 参与门禁，moderate/low 仅打印），消除双轨口径。
        run: |
          set -euo pipefail
          npm audit --json > npm-audit-report.json || true
          cat npm-audit-report.json

      - name: Security ratchet gate（依赖安全基线门禁）
        # 测试体系评估报告 P1-③：scripts/security_gate.py + 全零基线已就绪，
        # 在此接入 —— pip-audit 漏洞数 / npm critical/high 任一高于基线即阻断。
        run: python scripts/security_gate.py

      - name: 完整性清单 Ed25519 验签（R10）
        # 任务书阶段一验收：CI 用内置公钥验证清单签名——证明清单确由持有私钥的
        # 签发机签发（防「同步篡改代码+清单」投毒，报告2 §二防线2）。
        # 清单/签名/公钥随提交入库，本步在装好 requirements-lock（含 cryptography）后执行。
        run: python scripts/sign_integrity_manifest.py --verify

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            pip-audit-report.json
            npm-audit-report.json

  # ── 安全断言（部署安全红线，2026-08-17 新增） ──────────────────
  security-assertions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 禁止 0.0.0.0 监听
        run: |
          HITS=$(grep -rn --include='*.py' --include='*.bat' --include='*.sh' --include='*.yml' \
            -E "host[[:space:]]*=[[:space:]]*['\"]0\.0\.0\.0|--host[[:space:]]+0\.0\.0\.0" \
            scripts backend config.yaml start.bat start.sh 2>/dev/null | grep -v tests || true)
          if [ -n "$HITS" ]; then echo "FAIL: 发现 0.0.0.0 监听配置"; echo "$HITS"; exit 1; fi
          echo "PASS: 无 0.0.0.0 监听配置"
      - name: 入口文件一致性
        run: |
          test -f scripts/clean_launch.py || test -f backend/main.py || exit 1
          test -f requirements.txt
          echo "PASS: 入口与依赖清单存在"
      - name: 依赖锁存在性
        run: |
          test -f requirements-lock.txt || (echo "FAIL: 缺少 requirements-lock.txt" && exit 1)
          echo "PASS: 依赖锁存在"
      - name: 配置-实现一致性门禁（幽灵控制检测）
        # 安全评估 M1 根因门禁：MMH3_* 环境变量覆盖的 Settings 字段必须被代码真实
        # 应用，否则判失败（声明即生效的假安全感）。纯标准库，无需安装依赖。
        run: |
          python scripts/check_config_refs.py
      - name: comfy_kernel 暴露面棘轮 + 调用面断言
        # 安全合规评估报告（2026-09-05）P1：vendored cli_args.py 裸 --listen 回退
        # 0.0.0.0,:: 的写法（const=）不被上方 0.0.0.0 断言的 grep 模式匹配，
        # 且 comfy_kernel/ 不在其扫描目录内 → 门禁盲区。两道断言堵死：
        # ① 棘轮：该回退行一旦变更（含上游升级）即 fail，须人工确认暴露面后更新本模式；
        # ② 调用面：项目代码（backend/scripts/start.*）禁止 --listen 传参——
        #    当前 in-process 引擎不启动 HTTP server，未来自动拉起必须显式 loopback。
        # ⚠ 执行域说明：comfy_kernel/ 为 vendored 目录、不入版本控制（.gitignore:128），
        #   GitHub 托管 runner 的 checkout 里没有该文件 → 棘轮在此只能优雅跳过，
        #   实际强制执行在本地 precheck.ps1（push 前钩子必经，本机存在内核）。
        run: |
          if [ -f comfy_kernel/comfy/cli_args.py ]; then
            RATCHET=$(grep -c 'const="0.0.0.0,::"' comfy_kernel/comfy/cli_args.py 2>/dev/null || true)
            if [ "$RATCHET" != "1" ]; then
              echo "FAIL: comfy_kernel --listen 回退行丢失或被变更（匹配数: ${RATCHET:-0}）"
              echo "      上游升级后须人工确认 --listen 暴露面，再同步更新本断言的棘轮模式"
              exit 1
            fi
            echo "PASS: comfy_kernel 回退行棘轮锁定（匹配数 1）"
          else
            echo "SKIP: comfy_kernel/ 不入版本控制，CI checkout 无此文件——棘轮由本地 precheck.ps1 强制执行"
          fi
          HITS=$(grep -rn -- '--listen' backend scripts start.bat start.sh 2>/dev/null | grep -v tests | grep -vE ':[0-9]+:\s*#' || true)
          if [ -n "$HITS" ]; then echo "FAIL: 项目代码出现 --listen 传参（禁止裸 --listen，暴露面风险）"; echo "$HITS"; exit 1; fi
          echo "PASS: 项目调用面无 --listen"
      - name: 完整性清单与公钥配套断言（R10）
        # 任务书阶段一验收：清单、Ed25519 签名、内置公钥必须随代码入库；
        # 公钥一致性闸门（清单声明 public_key_sha256 == 仓库公钥文件哈希，
        # 行尾归一化口径）纯标准库即可判，验签在 security-scan job（有 cryptography）。
        run: |
          set -euo pipefail
          test -f backend/security/integrity_manifest.json || (echo "FAIL: 缺少完整性清单" && exit 1)
          test -f backend/security/integrity_manifest.json.sig.ed25519 || (echo "FAIL: 缺少 Ed25519 签名" && exit 1)
          test -f backend/security/manifest_signing_public_key.pem || (echo "FAIL: 缺少内置公钥" && exit 1)
          python - <<'PY'
          import hashlib, json
          m = json.load(open('backend/security/integrity_manifest.json', encoding='utf-8'))
          declared = m.get('public_key_sha256', '')
          pub = open('backend/security/manifest_signing_public_key.pem', 'rb').read().translate(None, b'\r')
          actual = hashlib.sha256(pub).hexdigest()
          assert declared and declared == actual, f"公钥一致性闸门失败: {declared} != {actual}"
          files = m.get('files') or {}
          assert files, "清单 files 为空"
          print(f"PASS: 完整性清单存在（{len(files)} 模块），公钥一致性闸门通过")
          PY

  # ── comfy B 方案（vendored 内核）守卫 ──────────────────────────
  # MLOps 评估（2026-09-05）P1：comfy_kernel/ 不入库（.gitignore:128），此前 B 方案
  # 推理路径在 CI 零覆盖。ADR-0005 取舍结论 = 条件式守卫（方案 C）：
  #   * 内核随 checkout 在场（自托管 runner / 本地）→ 跑内核漂移基线校验 + 棘轮复检 + 适配器测试
  #   * GitHub 托管 runner（无内核）→ 步骤级 SKIP，日志可见，不算通过也不算失败
  #   * 真机 GPU 全链路仍归 gpu-smoke.yml（复用 scripts/smoke_comfy.py）
  comfy-kernel-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      present: ${{ steps.kernel.outputs.present }}
      reason: ${{ steps.kernel.outputs.reason }}
    steps:
      - uses: actions/checkout@v4

      - name: 内核在场判定
        id: kernel
        run: |
          if [ -f comfy_kernel/comfy/cli_args.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "reason=comfy_kernel-present" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "reason=comfy_kernel-absent-vendored-not-in-repo" >> "$GITHUB_OUTPUT"
            # warning 而非仅 echo：让"三个守卫本次没执行"在 checks 页可见，
            # 不再与"守卫跑过且通过"共用一个绿色 job 结论。
            echo "::warning::comfy_kernel/ 未随 checkout 提供（vendored、GPL、不入库）——内核漂移基线 / --listen 回退棘轮 / comfy 适配器单测 三项守卫本次未执行"
          fi

      - uses: actions/setup-python@v7
        # 原先带 `if: present == 'true'`；下方的合成内核守卫验证步不依赖真实内核、
        # 需要 python，故改为无条件准备（ubuntu-latest 不保证 PATH 上有 `python`）。
        with:
          python-version: '3.12'

      # 合成内核上真跑两道守卫。此前基线比对与 --listen 棘轮都挂在
      # `if: present == 'true'` 下，而 comfy_kernel/ 属 vendored 不入库 →
      # 托管 runner 上恒 false → 守卫逻辑本身从未被 CI 验证过（只被
      # tests/test_comfy_kernel_baseline.py 以 import 方式验证，CLI 与棘轮模式未覆盖）。
      # 本步不依赖真实内核，因此带正/反向对照，防止退化成空跑。
      - name: 合成内核上验证守卫有效性（托管 runner 可执行）
        run: |
          set -euo pipefail
          W=$(mktemp -d)
          T="$W/comfy_kernel"
          mkdir -p "$T/comfy" "$T/custom_nodes"
          printf '[project]\nname = "comfyui"\nversion = "0.33.0"\n' > "$T/pyproject.toml"
          printf '# nodes\n' > "$T/nodes.py"
          printf '# sd\n' > "$T/comfy/sd.py"
          # 与真实内核 comfy/cli_args.py:63 同形态的 --listen 回退行
          printf '%s\n' 'parser.add_argument("--listen", type=str, default="127.0.0.1", metavar="IP", nargs="?", const="0.0.0.0,::", help="listen")' > "$T/comfy/cli_args.py"
          B="$W/baseline.json"
          python scripts/comfy_kernel_baseline.py --generate --root "$T" --out "$B"
          python scripts/comfy_kernel_baseline.py --check --root "$T" --out "$B"
          echo "PASS: 合成内核基线 --generate/--check 一致"
          # 反向对照：篡改后 --check 必须变红，否则基线守卫是空跑
          printf '# sd TAMPERED\n' > "$T/comfy/sd.py"
          if python scripts/comfy_kernel_baseline.py --check --root "$T" --out "$B" > /dev/null 2>&1; then
            echo "::error::篡改合成内核后 --check 仍判通过 —— 基线守卫无效"
            exit 1
          fi
          echo "PASS: 篡改被 --check 检出"
          # --listen 回退行棘轮：正向（模式必须命中未改动的行）
          R=$(grep -c 'const="0.0.0.0,::"' "$T/comfy/cli_args.py" || true)
          if [ "$R" != "1" ]; then
            echo "::error::棘轮模式在应命成的合成行上匹配 $R 次（期望 1）—— 模式已失效"
            exit 1
          fi
          # 反向对照：移除回退值后棘轮必须为 0，否则模式过宽抓不到真实回归
          sed -i 's/const="0.0.0.0,::"/const=""/' "$T/comfy/cli_args.py"
          R2=$(grep -c 'const="0.0.0.0,::"' "$T/comfy/cli_args.py" || true)
          if [ "$R2" != "0" ]; then
            echo "::error::篡改后棘轮仍匹配 $R2 次 —— 模式过宽，无法检出 --listen 回退丢失"
            exit 1
          fi
          echo "PASS: --listen 回退行棘轮正/反向均符合预期"
          rm -rf "$W"

      # 原步骤跑 scripts/check_comfy_kernel.py（移植期 PoC 报告），其 main() 除目录
      # 缺失外恒 return 0 → 在 CI 里永不可能变红，属装饰性门禁。换成有判定能力的
      # 基线守卫：内核在场（自托管/本地）时比对摘要，缺失时沿用上方 present 条件 SKIP。
      # 守卫自身"能否抓到篡改"由 tests/test_comfy_kernel_baseline.py 在每个 runner 上
      # 验证（用 tmp_path 合成内核，绝不写真实 comfy_kernel/）。
      - name: 内核漂移基线校验
        if: steps.kernel.outputs.present == 'true'
        run: python scripts/comfy_kernel_baseline.py --check

      - name: --listen 回退行棘轮复检
        if: steps.kernel.outputs.present == 'true'
        run: |
          RATCHET=$(grep -c 'const="0.0.0.0,::"' comfy_kernel/comfy/cli_args.py 2>/dev/null || true)
          if [ "$RATCHET" != "1" ]; then
            echo "FAIL: comfy_kernel --listen 回退行丢失或被变更（匹配数: ${RATCHET:-0}）"
            exit 1
          fi
          echo "PASS: --listen 回退行棘轮锁定"

      - name: comfy 适配器单测（纯标准库 + pytest，不拉 torch）
        if: steps.kernel.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          # --no-cov 必需：pytest.ini 的 addopts 带 --cov-fail-under=60，本步只跑 2 个
          # 文件的子集，覆盖率必然不达标 → 内核在场时（自托管/本地带 vendored 内核）
          # 这一步会以与被测代码无关的理由失败。同 #62 对 benchmark 的处理。
          pytest tests/test_comfy_engine.py tests/test_comfy_engine_integration.py --no-cov -q

  # 状态显式化（与 #63 对 gpu-smoke 的处理同款）：本 job 的名字会原样出现在 checks 列表。
  # 修的问题——comfy_kernel/ 是 vendored、GPL、不入库，托管 runner 上 present 恒 false，
  # 于是"内核漂移基线 / --listen 回退棘轮 / comfy 适配器单测"三项守卫**从未执行**，
  # 而 comfy-kernel-guard job 仍报 success，与"守卫跑过且通过"在 UI 上无法区分。
  # 刻意不改 `if: steps.kernel.outputs.present == 'true'` 的闸门语义，也不把缺失判红：
  # 内核不入库是有意为之的许可边界（见 docs/GPL_COMPLIANCE.md），改红会让每个 PR 恒红。
  kernel-guard-status:
    needs: comfy-kernel-guard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    name: ${{ needs.comfy-kernel-guard.outputs.present == 'true' && 'KERNEL GUARDS RAN (comfy_kernel present)' || format('NO KERNEL GUARDS RAN - SKIPPED ({0})', needs.comfy-kernel-guard.outputs.reason) }}
    steps:
      - name: Write verdict to run summary
        env:
          PRESENT: ${{ needs.comfy-kernel-guard.outputs.present }}
          REASON: ${{ needs.comfy-kernel-guard.outputs.reason }}
          RESULT: ${{ needs.comfy-kernel-guard.result }}
        run: |
          {
            if [ "$PRESENT" = "true" ]; then
              echo "## comfy_kernel 守卫：已执行"
              echo ""
              echo "- \`comfy-kernel-guard\` 结论：\`$RESULT\`（内核在场，基线/棘轮/适配器单测均已运行）"
            else
              echo "## comfy_kernel 守卫：本次未执行任何内核检查"
              echo ""
              echo "- 原因：\`$REASON\`；job 结论 \`$RESULT\`。"
              echo "- 以下三项**本次没有运行**：\`comfy_kernel_baseline.py --check\`（内核漂移）、\`--listen\` 回退行棘轮、comfy 适配器单测。"
              echo "- 本 workflow 的绿色不代表内核面被守卫过。真正执行需在有 vendored \`comfy_kernel/\` 的环境（自托管 runner 或本地）跑。"
              echo "- 内核不入库是既定许可边界（GPL-3.0，见 \`docs/GPL_COMPLIANCE.md\`），故此处只显式标注、不判红。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
