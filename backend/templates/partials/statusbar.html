  <span class="sb-item"><span class="sb-dot"></span><span id="connText">CONN: —</span></span>
  <span class="sb-item" id="queueItem">QUEUE 0 · 0</span>
  <span class="sb-item history-btn" id="historyBtn" role="button" tabindex="0" aria-label="历史库">历史库</span>

    <span id="totalDurSb">总时长 0s</span>

        <div class="engine-menu-note" id="engineNote"></div>
