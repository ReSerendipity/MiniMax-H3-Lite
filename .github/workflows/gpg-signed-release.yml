# MiniMax-H3-lite GPG 签名 Release 工作流（家族简化版）
#
# 对 Release 产物做 GPG 分离签名，供进阶用户验证未被篡改。
#
# 前提（仓库 Settings > Secrets and variables > Actions）:
#   - GPG_PRIVATE_KEY: ASCII-armored 私钥
#   - GPG_PASSPHRASE:  私钥口令
# 私钥未配置时本工作流以 notice 跳过（不算失败）。

name: GPG-Signed Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要签名的 Release tag（留空取最新 Release）"
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: write

jobs:
  sign-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Skip when GPG secrets are not configured
        if: env.GPG_PRIVATE_KEY == ''
        run: echo "::notice::GPG_PRIVATE_KEY not configured - nothing to do"

      - name: Download release assets
        id: download
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="$RELEASE_TAG"
          [ -z "$TAG" ] && TAG="$INPUT_TAG"
          [ -z "$TAG" ] && TAG=$(gh release list --limit 1 --json tagName -q .[0].tagName)
          [ -n "$TAG" ] || { echo "::error::no release found to sign"; exit 1; }
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          mkdir -p assets/
          if gh release download "$TAG" --dir assets/; then
            echo "has_assets=true" >> $GITHUB_OUTPUT
          else
            # 【降级口径统一 2026-09-25】原先这里是 ::error:: + exit 1，与文件头
            # "无 GPG_PRIVATE_KEY 时以 notice 跳过"的口径不一致，且踩中一个真实的坑：
            # 本仓 v0.1.0/v2.3.0/v2.3.1/v2.4.0/v2.4.1/v2.5.0 六个 Release **全部零资产**
            # （gh release view v2.5.0 --json assets 实测 assetNames=[]）。
            # ⇒ 只要有人配上 GPG_PRIVATE_KEY 再 publish，这条尾巴会直接红而不是签出名。
            # "本次没有可签发的东西"属正常态，改 notice 跳过；真正的异常（找不到 Release）
            # 仍保留 ::error::。历史零资产形状由新的 release.yml 负责终结。
            echo "has_assets=false" >> $GITHUB_OUTPUT
            echo "::notice::Release '$TAG' 无可下载资产——跳过签名（正常态，见 release.yml 产资产）"
          fi

      - name: Generate SHA256SUMS and sign
        if: env.GPG_PRIVATE_KEY != '' && steps.download.outputs.has_assets == 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd assets/
          sha256sum * > SHA256SUMS.txt
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --output SHA256SUMS.gpg --detach-sign SHA256SUMS.txt <<< "$GPG_PASSPHRASE"
          gpg --verify SHA256SUMS.gpg SHA256SUMS.txt

      - name: Upload signature
        if: env.GPG_PRIVATE_KEY != '' && steps.download.outputs.has_assets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.download.outputs.tag }}" assets/SHA256SUMS.txt assets/SHA256SUMS.gpg --clobber
          echo "SHA256SUMS uploaded"
