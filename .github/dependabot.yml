version: 2
updates:
  # minor/patch 合并为单个 PR，major 仍各自单独开 PR（便于逐个评审高风险版本跳跃）。
  # open-pull-requests-limit 限制并发 PR 数，避免 Dependabot 一次性铺开挤占 Actions 并发额度。
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      # pydantic-core 只能作为 pydantic 的精确配对版本入库（2.13.5 仅接受 2.46.5），
      # 单独升级必然造成锁内自相矛盾 -> pip ResolutionImpossible。
      # 事故复发两次：#25 (2026-09-14)、#44 (2026-09-17) 均把 core 抬到 2.49.0 打断 CI。
      # 随 pydantic 一起手工维护；pydantic 本体升级由 lock-consistency 闸门兜底。
      - dependency-name: "pydantic-core"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/tests"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
