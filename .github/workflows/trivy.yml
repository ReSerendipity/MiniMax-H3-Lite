# .github/workflows/trivy.yml
# 容器镜像漏洞扫描（CI 阻断 HIGH/CRITICAL）
#
# 触发：每次 push main / PR / 手动 dispatch
# 流程：本地 build 镜像（不 push） → trivy 扫描 → SARIF 上传 Security tab
# 失败条件：发现 HIGH/CRITICAL 级别 CVE 且有可用 fix（`--ignore-unfixed: true`）
#
# 复用 `Dockerfile` + 仓库的 LABEL 元数据（org.opencontainers.image.*）；
# 不依赖任何外部 registry 凭据。

name: Trivy Container Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # SARIF upload to Security tab

jobs:
  build-and-scan:
    name: Build & scan image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read app version from release-please manifest
        id: appver
        # 用 python3：ubuntu-24.04 runner 无 `python` 命令（PEP 668），此前静默
        # 失败导致 VERSION build-arg 为空（2026-09-05 Trivy CI 首跑实证）。
        # 注意引号层次：YAML 单引号外壳 + python 代码内全部双引号，
        # 不得出现反斜杠续行（曾报 SyntaxError: unexpected character after
        # line continuation character，VERSION 再次为空）。
        run: echo "version=$(python3 -c 'import json;print(json.load(open(".release-please-manifest.json"))["."])')" >> "$GITHUB_OUTPUT"

      - name: Build image (local only; not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: minimax-h3-lite:scan-${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VERSION=${{ steps.appver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inventory python package locations (scan diagnostics)
        # Trivy 报 setuptools 70.3.0 / msgpack 1.1.2，但构建层证明
        # /usr/local/lib/python3.12/site-packages 已是 84.0.0 / 1.2.2
        # （2026-09-05 run 日志实证）——版本必然来自镜像内另一处包目录。
        # 此步列出全镜像 dist-info 分布，定位第二包树的物理路径。
        run: |
          docker run --rm --user root --entrypoint sh \
            minimax-h3-lite:scan-${{ github.sha }} -c \
            "find / -xdev -maxdepth 8 \( -iname 'setuptools-*.dist-info' -o -iname 'msgpack-*.dist-info' \) 2>/dev/null; \
             echo '--- pip view (system python) ---'; \
             pip list 2>/dev/null | grep -iE 'msgpack|setuptools' || true"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: minimax-h3-lite:scan-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'        # 有 HIGH/CRITICAL 漏洞就 fail
          vuln-type: 'os,library'
          scanners: 'vuln'
          # torch cu130 + 全量 Python 依赖的 CVE 面很大，默认 5 分钟扫描窗
          # 会 context deadline exceeded（2026-09-05 CI 实证）→ 放宽到 20 分钟
          timeout: '20m'

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-image-scan

      - name: Cleanup local scan image
        if: always()
        run: docker rmi minimax-h3-lite:scan-${{ github.sha }} || true
