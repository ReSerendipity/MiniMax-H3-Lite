name: SAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'  # 每周一 UTC 05:00

permissions:
  contents: read

# 同 workflow + 同触发事件 + 同 ref 去重，取消被取代的排队作业。
# 带上 event_name 是必要的：这些作业同时有 schedule / workflow_dispatch / push 多种触发，
# 只用 workflow-ref 会让定时任务与推送任务互相取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 定位声明（测试体系评估报告 P3-⑦ 落地）：本 job 不再是纯 report-only ——
    # 扫描产出 semgrep.json 报告（扫描工具自身非零退出不在此处阻断），
    # 阻断判定由 scripts/sast_gate.py 按 .ci/semgrep_baseline.json 棘轮执行：
    # ERROR 数高于基线（当前基线=1，即 shots.py 白名单校验的已确认可接受项）→ CI 变红。
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep Scan (JSON report)
        run: |
          python -m pip install semgrep==1.173.0
          semgrep scan --config auto --severity ERROR --json --output semgrep.json || true

      - name: SAST ratchet gate（SAST 基线门禁）
        run: python scripts/sast_gate.py

      - name: Semgrep SARIF (all severities)
        if: always()
        run: |
          semgrep scan --config auto --sarif --output semgrep.sarif || true

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        # 【F-5 2026-09-24】去掉 continue-on-error: true。它原先把「扫描结果根本没进
        # code scanning」这一类失败咽掉，仍呈现全绿。当前该步在 main 实测 success
        # （run 35989187748 / step 6），摘掉兜底不会引入新红。
        # ⚠ 上面两处 `|| true` 是设计而非遗漏，勿顺手删：semgrep 只要**有命中**即以
        # 非零退出，而 .ci/semgrep_baseline.json 基线 error=1（shots.py 已确认可接受项）
        # ——当前每个 run 都在命中这 1 条，删掉 `|| true` 会让本 job 每 run 必红，并绕过
        # scripts/sast_gate.py 的棘轮仲裁。真正的判定分离口径见 sast_gate.py 的
        # load_report()：报告缺失/非 JSON/缺 results 字段一律 exit 1，不做首次自动放行。
        with:
          sarif_file: semgrep.sarif
