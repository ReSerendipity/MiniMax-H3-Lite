# .github/workflows/gpu-smoke.yml
# Weekly + manual REAL-INFERENCE smoke on a self-hosted GPU runner (label: gpu).
#
# 补齐 MiniMax-H3-lite 在「GPU 真机推理 CI」维度的历史缺口：
# 此前 .github/workflows/ 仅有 docs-consistency / release-please / sast / stale / test，
# runs-on 全为 GitHub 托管 runner（ubuntu / windows），无任何 GPU 真机推理验证——
# diffusers 升级、torch/CUDA 变体变更、权重加载路径改动后没有任何防线。
#
# 设计借鉴 SeedVR2-lite 的 gpu-smoke.yml（runner-precheck + gpu-smoke 双 job），
# 与 Image_MultiModel / TTS_MultiModel 家族一致。与三者不同：本项目已自带
# 真实权重推理冒烟脚本 scripts/smoke_real.py（校验 torch/diffusers → CUDA → 权重
# 路径 → 跑 diffusers ModularPipeline → 落盘非空 mp4），故本 workflow 直接复用它，
# 无需另造冒烟脚本。
#
# 运行前提（一次性，在 GPU 机器上）：
#   1. 注册 self-hosted runner，额外打 `gpu` label
#      (Settings -> Actions -> Runners -> New self-hosted runner -> --labels gpu)
#   2. 预置 Python 虚拟环境（含 torch CUDA + 本项目依赖 + diffusers==0.39.0 + transformers）；
#      路径通过仓库变量 GPU_SMOKE_VENV 指定（如 /opt/venv-mmh3/bin）。未配置时回退到默认
#      python 并尝试 pip install -r requirements.txt（不推荐，权重环境应预置）。
#   3. 模型权重就位：通过仓库变量 GPU_SMOKE_MODEL_PATH 指向本地权重目录
#      （H3-Base-FL2VA / H3-Base-Ref2VA），或已置于本机 HF 缓存
#      （MiniMaxAI/MiniMax-H3）。未配置且本地无权重时，smoke_real.py 以退出码 2 优雅跳过。
#   4. NVIDIA 驱动可用；约数 GB 空闲显存（默认 5 帧 768×768，开启 cpu offload）。
#   5. 仓库 Secrets 配置 REPO_ADMIN_TOKEN（具备 actions:read / admin 权限），
#      供 runner-precheck 查询 runner 在线状态。
# 无 gpu runner 在线时，周更作业经 runner-precheck 优雅跳过（available=false），不会长期飘红。
# 但"跳过"不得被读成"已验证"：smoke-status job 会把结论写进 checks 列表的 job 名
# （NO REAL INFERENCE - SKIPPED (<reason>)）与 run 摘要，故整条工作流绿色时仍可自行分辨。

name: GPU Smoke (real inference, self-hosted)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/sha to smoke (empty = default branch)"
        required: false
        default: ""
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC

permissions:
  contents: read

jobs:
  runner-precheck:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Check for an online self-hosted GPU runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            # warning 而非 notice：notice 不在 checks 页显眼出现，正是"被读成已验证"的成因之一
            echo "::warning::REPO_ADMIN_TOKEN secret not configured - cannot query runner status; REAL INFERENCE WILL NOT RUN"
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-repo-admin-token-secret" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # runners 列表 API 需要管理员级 token（GITHUB_TOKEN 即使 actions:read 也 403）
          COUNT=$(gh api "repos/${{ github.repository }}/actions/runners" \
            --jq '[.runners[] | select(.status == "online") | select(any(.labels[]; .name == "gpu"))] | length')
          echo "online gpu-labelled runners: ${COUNT}"
          if [ "${COUNT}" -gt 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "reason=runner-available" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no online self-hosted runner with label 'gpu'; REAL INFERENCE WILL NOT RUN"
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-online-gpu-labelled-runner" >> "$GITHUB_OUTPUT"
          fi

  gpu-smoke:
    needs: runner-precheck
    if: needs.runner-precheck.outputs.available == 'true'
    runs-on: [self-hosted, gpu]
    timeout-minutes: 150
    env:
      CUDA_VISIBLE_DEVICES: "0"
      MMH3_MODEL_PATH: ${{ vars.GPU_SMOKE_MODEL_PATH }}
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    steps:
      - name: Fetch source via codeload (avoid git smart-HTTP stall on GPU runner)
        shell: pwsh
        # env 中转消灭 script-injection（SAST ERROR，2026-09-05 gate 首拦）：
        # workflow_dispatch 的 inputs.ref 属不可信输入，禁止内插进 run 脚本体。
        env:
          SRC_REF: ${{ github.event.inputs.ref || github.ref_name }}
          SRC_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $ref = $env:SRC_REF
          Invoke-WebRequest "https://codeload.github.com/$($env:SRC_REPO)/tar.gz/refs/heads/$ref" -OutFile src.tgz -UseBasicParsing
          New-Item -ItemType Directory -Path repo -Force | Out-Null
          tar -xzf src.tgz -C repo --strip-components=1
          Remove-Item src.tgz -Force
          Get-ChildItem repo | Select-Object Name

      - name: Resolve Python interpreter
        id: py
        shell: pwsh
        run: |
          $venv = "${{ vars.GPU_SMOKE_VENV }}"
          if ($venv -and (Test-Path $venv)) {
            "python=$venv/bin/python" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          } else {
            "python=python" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          }

      - name: Install deps (fallback if no prebuilt venv configured)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not "${{ vars.GPU_SMOKE_VENV }}") {
            & ${{ steps.py.outputs.python }} -m pip install -r requirements.txt
          } else {
            Write-Host "using prebuilt venv; skipping pip install"
          }

      - name: CUDA / torch sanity gate
        shell: pwsh
        run: |
          & ${{ steps.py.outputs.python }} -c "import torch; assert torch.cuda.is_available(), 'CUDA not available'; print('CUDA', torch.cuda.get_device_name(0))"

      - name: Real-weight inference smoke (scripts/smoke_real.py)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          cd repo
          # 复用项目自带真实权重推理冒烟：
          # 退出码 0 = 通过 / 1 = 失败（依赖缺失或推理报错）/ 2 = 环境跳过（无 CUDA 或无权重）
          & ${{ steps.py.outputs.python }} scripts/smoke_real.py --prompt "A cat walking on a beach, cinematic." --allow-download
          $rc = $LASTEXITCODE
          if ($rc -eq 2) {
            Write-Host "::notice::smoke_real.py returned 2 (env skip: no CUDA or no local weights) - not a failure"
            exit 0
          }
          if ($rc -ne 0) { throw "GPU real-inference smoke failed (rc=$rc)" }

      - name: Container-image inference smoke (build + run in-image)
        shell: pwsh
        env:
          MODEL_PATH: ${{ vars.GPU_SMOKE_MODEL_PATH }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          # T5 / P2-c（评估 v1.0.0）：验证「本次构建的镜像本身」能推理，
          # 覆盖 cu130 轮子 / ffmpeg / appuser 权限等镜像层回归（host venv 冒烟测不到）。
          # 复用同一 scripts/smoke_real.py；权重经 -v 挂载（与 compose 一致），
          # 未配置 GPU_SMOKE_MODEL_PATH 时回退 --allow-download。
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
            Write-Host "::notice::docker not available on runner - skipping in-image smoke"
            exit 0
          }
          cd repo
          docker build -t mmh3:ci -f Dockerfile .
          $mount = ""
          if ($env:MODEL_PATH) { $mount = "-v `"$($env:MODEL_PATH):/app/model:ro`"" }
          docker run --rm --gpus all $mount -e MMH3_MODEL_PATH=/app/model mmh3:ci python scripts/smoke_real.py --prompt "A cat walking on a beach, cinematic." --allow-download
          $rc = $LASTEXITCODE
          if ($rc -eq 2) {
            Write-Host "::notice::in-image smoke returned 2 (env skip: no CUDA or no local weights) - not a failure"
            exit 0
          }
          if ($rc -ne 0) { throw "in-image inference smoke failed (rc=$rc)" }

      - name: Report GPU status
        if: always()
        shell: pwsh
        run: |
          nvidia-smi || true

      - name: Upload smoke report + generated mp4
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mmh3-gpu-smoke-${{ github.run_number }}
          path: |
            repo/outputs/smoke_real.mp4
          if-no-files-found: ignore
          retention-days: 7

  # 状态显式化：本 job 的名字会原样出现在 checks 列表里。
  # 修的问题——原先"没有 gpu runner"时整条工作流呈现全绿（gpu-smoke 只是 skipped），
  # 与"真推理跑过了"在 UI 上无法区分；这正是本仓刚清理过的那类静默失效。
  # 刻意不把跳过判成 failure：本文件头部既定设计就是"无 runner 时优雅跳过、不长期飘红"，
  # 周更环境依赖作业长期红会淹没真实性能/推理回归。
  smoke-status:
    needs: [runner-precheck, gpu-smoke]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: ${{ needs.runner-precheck.outputs.available == 'true' && format('REAL INFERENCE RAN (gpu-smoke={0})', needs.gpu-smoke.result) || format('NO REAL INFERENCE - SKIPPED ({0})', needs.runner-precheck.outputs.reason) }}
    steps:
      - name: Write verdict to run summary
        env:
          AVAILABLE: ${{ needs.runner-precheck.outputs.available }}
          REASON: ${{ needs.runner-precheck.outputs.reason }}
          RESULT: ${{ needs.gpu-smoke.result }}
        run: |
          {
            if [ "$AVAILABLE" = "true" ]; then
              echo "## GPU 真机推理冒烟：已执行"
              echo ""
              echo "- \`gpu-smoke\` 结论：\`$RESULT\`"
            else
              echo "## GPU 真机推理冒烟：未执行任何真实推理"
              echo ""
              echo "- 跳过原因：\`$REASON\`"
              echo "- 本次工作流的绿色仅代表托管 runner 上的前置检查通过，**不代表 H3 权重推理链路可用**。"
              echo "- 恢复条件见本文件头部「运行前提」：注册带 \`gpu\` label 的 self-hosted runner，并配置 \`REPO_ADMIN_TOKEN\`。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
