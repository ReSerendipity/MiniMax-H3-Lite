# MM·H3 工作台 - 测试与质量门禁 CI
name: Test & Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  # ── Python 后端测试 ──────────────────────────────────────
  python-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install pytest pytest-cov pytest-benchmark

      - name: Run tests with coverage
        env:
          MMH3_INFERENCE_BACKEND: diffusers
        run: pytest tests/ --cov=backend --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=40 -v

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ── 前端冒烟测试 ──────────────────────────────────────
  frontend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd tests && npm ci

      - name: Run frontend smoke test
        run: npm run test:frontend || true

  # ── 代码质量检查 ──────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint Python
        run: |
          pip install flake8
          flake8 backend/ tests/*.py \
            --ignore=E501,W503,E402 \
            --max-line-length=120 \
            --count --show-source --statistics

      - name: Install Node lint tools
        run: npm ci

      - name: Lint JavaScript
        run: npx eslint tests/frontend/*.js tests/*.js --no-error-on-unmatched-pattern

  # ── 安全扫描 ──────────────────────────────────────
  # 类型门禁（mypy ratchet，家族底线对齐 2026-09-03）：
  # 阻断的是「债务上升」而非「债务为零」：存量 7 处错误记录在
  # .ci/mypy_baseline.txt，不要求一次清零；任何新增类型回归都会让本 job 变红。
  # 基线与「本 job 只装 mypy、不装项目依赖」强耦合：第三方符号在 mypy 眼里是
  # Any，换 mypy 版本或改本 job 依赖集，必须用相同命令重新生成基线：
  #   pip install mypy==<同版本>
  #   mypy backend/ --ignore-missing-imports --no-error-summary | grep -c 'error:'
  typecheck:
    name: Typecheck (mypy ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mypy
        run: pip install mypy==2.3.1

      - name: Run mypy and enforce ratchet
        run: |
          mypy backend/ --ignore-missing-imports --no-error-summary > mypy.log 2>&1 || true
          # grep -c 零匹配时仍打印 0 但退出码 1，故只能 `|| true`，不能 `|| echo 0`
          # （后者在债务真清零时会让 COUNT 变成 "0\n0"，数值比较处反而崩掉）。
          COUNT=$(grep -c 'error:' mypy.log || true)
          BASELINE=$(tr -d '[:space:]' < .ci/mypy_baseline.txt)
          COUNT=${COUNT:-0}
          if ! [ "$COUNT" -eq "$COUNT" ] 2>/dev/null || ! [ "$BASELINE" -eq "$BASELINE" ] 2>/dev/null; then
            echo "::error::计数解析失败 (COUNT='$COUNT' BASELINE='$BASELINE')，门禁本身出错，拒绝放行"
            exit 1
          fi
          echo "mypy 错误数: $COUNT（基线 $BASELINE）"
          echo "### mypy: $COUNT errors (baseline $BASELINE)" >> "$GITHUB_STEP_SUMMARY"
          head -n 60 mypy.log
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::类型债务上升：$BASELINE -> $COUNT。本门禁只降不升；如确需新增，请连同基线一起说明原因。"
            exit 1
          fi
          if [ "$COUNT" -lt "$BASELINE" ]; then
            echo "::warning::类型债务已降至 $COUNT，请把 .ci/mypy_baseline.txt 从 $BASELINE 下调以固化成果。"
          fi

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          npm ci

      - name: Python security audit
        run: |
          set -euo pipefail
          pip install pip-audit
          pip-audit --format json > pip-audit-report.json || true
          cat pip-audit-report.json

      - name: NPM security audit
        run: |
          set -euo pipefail
          npm audit --json > npm-audit-report.json
          cat npm-audit-report.json

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            pip-audit-report.json
            npm-audit-report.json

  # ── 安全断言（部署安全红线，2026-08-17 新增） ──────────────────
  security-assertions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 禁止 0.0.0.0 监听
        run: |
          HITS=$(grep -rn --include='*.py' --include='*.bat' --include='*.sh' --include='*.yml' \
            -E "host[[:space:]]*=[[:space:]]*['\"]0\.0\.0\.0|--host[[:space:]]+0\.0\.0\.0" \
            scripts backend config.yaml start.bat start.sh 2>/dev/null | grep -v tests || true)
          if [ -n "$HITS" ]; then echo "FAIL: 发现 0.0.0.0 监听配置"; echo "$HITS"; exit 1; fi
          echo "PASS: 无 0.0.0.0 监听配置"
      - name: 入口文件一致性
        run: |
          test -f scripts/clean_launch.py || test -f backend/main.py || exit 1
          test -f requirements.txt
          echo "PASS: 入口与依赖清单存在"
      - name: 依赖锁存在性
        run: |
          test -f requirements-lock.txt || (echo "FAIL: 缺少 requirements-lock.txt" && exit 1)
          echo "PASS: 依赖锁存在"
      - name: 配置-实现一致性门禁（幽灵控制检测）
        # 安全评估 M1 根因门禁：MMH3_* 环境变量覆盖的 Settings 字段必须被代码真实
        # 应用，否则判失败（声明即生效的假安全感）。纯标准库，无需安装依赖。
        run: |
          python scripts/check_config_refs.py
