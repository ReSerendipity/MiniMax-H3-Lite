name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dco:
    name: DCO Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by
        shell: bash
        run: |
          set -euo pipefail
          # 机器人提交按**作者邮箱**豁免，而不是用 job 级
          # `if: github.actor != 'dependabot[bot]'` 整体跳过——后者让 bot PR 上的
          # DCO 是 skipped，与"真检查过且通过"在 checks 页无法区分。
          # 两个邮箱取自本仓真实提交实测：dependabot PR #51/#57 的 commit
          # author.email 均为 49699333+dependabot[bot]@users.noreply.github.com
          # （committer 是 noreply@github.com，故不能按 committer 判，否则人类
          #  经 GitHub 网页合并的提交也会被误豁免）。
          BOT_AUTHOR_EMAILS='49699333+dependabot[bot]@users.noreply.github.com
          41898282+github-actions[bot]@users.noreply.github.com'
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          if [[ -z "$base_sha" || -z "$head_sha" ]]; then
            echo "::error::Could not determine PR base/head SHA"
            exit 1
          fi
          fails=0
          checked=0
          exempt=0
          while IFS= read -r commit; do
            ae=$(git log -1 --format='%ae' "$commit")
            if printf '%s\n' "$BOT_AUTHOR_EMAILS" | grep -qFx "$ae"; then
              echo "exempt (bot author): ${commit:0:7} <$ae>"
              exempt=$((exempt+1))
              continue
            fi
            checked=$((checked+1))
            if ! git log -1 --format='%B' "$commit" | grep -q 'Signed-off-by:'; then
              echo "::error::Commit $commit (<$ae>) is missing 'Signed-off-by:' trailer (run: git commit -s)"
              fails=1
            fi
          done < <(git rev-list "$base_sha..$head_sha")
          echo "DCO: 人类提交 $checked 个（$fails 个缺签名），机器人提交豁免 $exempt 个"
          exit $fails
