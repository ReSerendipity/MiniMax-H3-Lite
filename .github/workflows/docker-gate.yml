# .github/workflows/docker-gate.yml
# 发布门禁五步（Docker 实测）——《AI应用分发安全加固指南》阶段三 P1-② 落地：
# 《分发能力评估.md》列出的剩余前置之一「发布机 --docker 实测」。
#
# 背景（执行对照表 · Docker 引擎受阻记录，2026-09-11）：
#   本机无法安装 Docker 引擎——① desktop.docker.com 下载持续连接重置
#   （WinError 10054，分块重试 15 轮仅完成 20MB/604MB）；② WSL2 组件损坏
#   （Wsl/CallMsi/Install/REGDB_E_CLASSNOTREG），提权 wsl --update /
#   wsl --install --no-distribution 均无法自愈。按任务书「受阻处置·替代方案」，
#   采用 GitHub 托管 runner（自带 Docker 守护进程）作为等价容器执行域，
#   完成 verify_release_integrity.py --docker 五步实测；结果作为分发能力
#   评估的 Docker 门禁证据（对照表留痕）。
#
# 设计对齐家族约定（docker-scan.yml / gpu-smoke.yml）：
#   - permissions: contents: read（最小权限）
#   - actions hash-pin / 官方 action
#   - 五步 = build(compileall) + unpack(自检 full+验签) + negative(入包清点)
#            + tamper(篡改模拟) + smoke(真实启动) + docker(build+容器内 diag)
#   - 触发：push 到 main 且命中相关路径；或手动 workflow_dispatch

name: Release Integrity Gate (Docker)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements*.txt'
      - '.github/workflows/docker-gate.yml'

permissions:
  contents: read

# 同 workflow + 同触发事件 + 同 ref 去重，取消被取代的排队作业。
# 带上 event_name 是必要的：这些作业同时有 schedule / workflow_dispatch / push 多种触发，
# 只用 workflow-ref 会让定时任务与推送任务互相取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          # 本仓有多份清单（requirements.txt / requirements-lock.txt /
          # requirements-frozen-20260913.txt），缓存键须显式列文件而非靠默认探测：
          # 本 job 只安装 requirements.txt（requirements-lock.txt 是 python-test 的路径），
          # 因此只按它建键——把无关清单纳入键会让本 job 缓存被无关提交频繁击穿。
          cache-dependency-path: requirements.txt

      - name: Install deps
        # 【F-1 2026-09-24】requirements.txt 不 pin torch，但第 28 行 torchsde 声明
        # torch>=1.6.0 ⇒ 解析器从 PyPI 默认索引拿 **CUDA 构建**，连带 cuda-toolkit==13.0.3
        # 的 12 个 nvidia_* extra 与 triton 一起进图。
        # run 35977211825 step "Install deps" 日志实测：下载 130 个 wheel / 共 3.18 GB，
        # 其中 CUDA-GPU 相关 2.93 GB（92.2%）——最大三件 torch 554.6 MB、
        # nvidia_cudnn_cu13 553.1 MB、nvidia_cublas 423.1 MB。而本 job 是发布完整性静态
        # 门禁 + docker build 校验，一次都不 import torch，这 2.93 GB 纯属白拿。
        # 指 CPU 索引后 pip 取 2.14.0+cpu：本地版本标签按 PEP 440 排在 2.14.0 之上，
        # 故 --extra-index-url 足以让 CPU 轮胜出；且 +cpu 轮不声明 nvidia 依赖，CUDA 轮
        # 直接不进解析图。
        # ⚠ 不改 Dockerfile：镜像里 cu130 是有意的（GPU 工作台本就该带 CUDA），
        #   本步只修托管 runner 上这道 CPU-only 门禁的环境。
        run: |
          set -euo pipefail
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          # 自证 A：出现任何 CUDA/GPU 分发即说明 torch 被静默解析成了 CUDA 构建。
          # 注意分发名含连字符（nvidia-cudnn-cu13 / cuda-toolkit），字符类必须带 -，
          # 否则 [a-z0-9]+ 会在 cudnn 处截断、要求紧跟 == 而永不匹配。
          GPU=$(pip list --format=freeze | grep -oE '^(nvidia-[a-z0-9-]+|cuda-[a-z0-9-]+|triton)==[^ ]*' || true)
          if [ -n "$GPU" ]; then
            echo "::error::CPU-only 门禁环境出现 GPU/CUDA 轮，torch 被静默解析为 CUDA 构建："
            printf '%s\n' "$GPU"
            exit 1
          fi
          # 自证 B：torch 若在场，必须是 +cpu 本地标签；无标签即 PyPI 默认（CUDA）构建。
          # 不把 torch 缺席当错误——本 job 本就不 import 它，缺席是合法的。
          TORCH=$(pip list --format=freeze | grep -oE '^torch==[^ ]*' || true)
          if [ -n "$TORCH" ] && ! printf '%s' "$TORCH" | grep -qF '+cpu'; then
            echo "::error::torch 非 CPU 构建：$TORCH"
            exit 1
          fi
          echo "OK：未出现任何 CUDA/GPU 轮；torch = ${TORCH:-未安装（本 job 不需要）}"

      - name: Run five-step gate (docker)
        run: python scripts/verify_release_integrity.py --docker
